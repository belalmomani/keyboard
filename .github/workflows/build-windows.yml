name: Build Windows

# Builds the PC programs for Windows and keeps them as the artifact "beckon-windows-programs".
# Start it by hand (Actions -> Build Windows -> Run workflow). No secrets are used.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows programs
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build
        run: cargo build --release --locked --bin beckon --bin beckon-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: beckon-windows-programs
          path: |
            target/release/beckon.exe
            target/release/beckon-server.exe
          if-no-files-found: error
