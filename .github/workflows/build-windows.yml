name: Build Windows

# Builds the PC programs for Windows and keeps them as the artifact "beckon-windows-programs".
# Start it by hand (Actions -> Build Windows -> Run workflow). No secrets are used.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows programs
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # Link the C runtime into the program, so that it starts on a PC without the
      # Visual C++ Redistributable (the VCRUNTIME140.dll error).
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --bin beckon --bin beckon-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: beckon-windows-programs
          path: |
            target/release/beckon.exe
            target/release/beckon-server.exe
          if-no-files-found: error
